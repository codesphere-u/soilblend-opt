[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "soilblend-opt"
version = "0.1.0"
description = "Zero-dependency soil fertility & fertilizer blend optimizer: Kamprath acidic soil CaCO3 lime neutralization, soil-test crop N-P-K gap analysis, pure-Python LP least-cost NPK blending, and split-application schedules."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "soil-fertility",
    "fertilizer-blending",
    "liming",
    "agritech",
    "linear-programming",
    "agriculture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
soilblend-opt = "soilblend_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soilblend_opt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
